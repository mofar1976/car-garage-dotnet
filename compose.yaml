name: car-garage-dotnet

services:
  postgres:
    image: postgis/postgis:17-3.5
    # This PostGIS image runs through emulation on Apple Silicon.
    platform: linux/amd64
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-car_garage}
      POSTGRES_USER: ${POSTGRES_USER:-car_garage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  migrate:
    image: car-garage-dotnet-api
    build:
      context: .
      dockerfile: Dockerfile
    command: ["--migrate"]
    environment:
      Database__ConnectionString: 'Host=postgres;Port=5432;Database=${POSTGRES_DB:-car_garage};Username=${POSTGRES_USER:-car_garage};Password="${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"'
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: car-garage-dotnet-api
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      Jwt__Secret: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env}
      Jwt__AccessTtlSeconds: ${JWT_ACCESS_TTL_SECONDS:-900}
      Jwt__RefreshTtlDays: ${JWT_REFRESH_TTL_DAYS:-30}
      Database__ConnectionString: 'Host=postgres;Port=5432;Database=${POSTGRES_DB:-car_garage};Username=${POSTGRES_USER:-car_garage};Password="${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"'
    ports:
      - "127.0.0.1:${API_PORT:-4000}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

volumes:
  postgres_data:
